name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run dataset:fixture
      - run: bun run dataset:full
      - name: Fail on uncommitted generated changes
        run: git diff --exit-code -- data/generated src/data/generated
      - run: bun test
      - run: bun run type-check
      - run: bun run build
